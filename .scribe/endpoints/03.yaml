name: Agendamentos
description: ''
endpoints:
  -
    custom: []
    httpMethods:
      - POST
    uri: api/agendamento
    metadata:
      custom: []
      groupName: Agendamentos
      groupDescription: ''
      subgroup: ''
      subgroupDescription: ''
      title: 'Agendar Horário'
      description: |-
        Este endpoint permite que um cliente logado realize um agendamento de 30 minutos.
        O sistema valida se o horário está disponível e notifica os administradores via SMTP.
      authenticated: true
      deprecated: false
    headers:
      Content-Type: application/json
      Accept: application/json
    urlParameters: []
    cleanUrlParameters: []
    queryParameters: []
    cleanQueryParameters: []
    bodyParameters:
      start_date:
        custom: []
        name: start_date
        description: 'Data do agendamento no formato DDMMAAAA.'
        required: true
        example: '15052026'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
      start_time:
        custom: []
        name: start_time
        description: 'Horário de início no formato HH:mm.'
        required: true
        example: '14:30'
        type: string
        enumValues: []
        exampleWasSpecified: true
        nullable: false
        deprecated: false
    cleanBodyParameters:
      start_date: '15052026'
      start_time: '14:30'
    fileParameters: []
    responses:
      -
        custom: []
        status: 201
        content: |-
          {
           "message": "Agendamento realizado com sucesso!",
           "data": {
             "id": 10,
             "client_id": 5,
             "start_date": "2026-05-15",
             "end_date": "2026-05-15",
             "start_time": "14:30",
             "end_time": "15:00"
           }
          }
        headers: []
        description: ''
      -
        custom: []
        status: 422
        content: |-
          {
           "error": "Horário indisponível"
          }
        headers: []
        description: ''
    responseFields: []
    auth: []
    controller: null
    method: null
    route: null
